services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
      - "2137:2137" #Debug port
    networks:
      - for_company_network
    environment:
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: ${eureka_password}
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
      - "5000:5000" #Debug port
    depends_on:
      - discovery-server
      - authentication-service
      - company-service
      - event-service
      - document-service
      - notification-service
    networks:
      - for_company_network
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      CLIENT_APPLICATION_ADDRESS: ${client_application_address}
      TOKEN_SECRET_KEY: ${token_secret_key}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  authentication-service:
    build:
      context: .
      dockerfile: authentication-service/Dockerfile
    container_name: authentication-service
    ports:
      - "5001:5001" #Debug port
    depends_on:
      - discovery-server
      - authentication-database
    networks:
      - for_company_network
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${postgres_datasource_password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://authentication-database:5432/authentication-service
      TOKEN_SECRET_KEY: ${token_secret_key}
      IMAGE_KIT_URL_ENDPOINT: https://ik.imagekit.io/forcompany/user-profile-pictures
      IMAGE_KIT_PRIVATE_KEY: ${image_kit_private_key}
      IMAGE_KEY_PUBLIC_KEY: ${image_kit_public_key}
      STRIPE_PAYMENT_PRIVATE_KEY: ${stripe_payment_private_key}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    container_name: company-service
    ports:
      - "5002:5002" #Debug port
    depends_on:
      - discovery-server
      - company-database
    networks:
      - for_company_network
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${postgres_datasource_password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://company-database:5432/company-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: event-service
    ports:
      - "5003:5003" #Debug port
    depends_on:
      - discovery-server
      - event-database
    networks:
      - for_company_network
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${postgres_datasource_password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-database:5432/event-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: document-service
    ports:
      - "5004:5004" #Debug port
    depends_on:
      - discovery-server
      - document-database
      - message-queue
    networks:
      - for_company_network
    dns:
      - 8.8.8.8
      - 8.8.5.5
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      SPRING_DATA_MONGODB_URI: mongodb://document-database:27017/document-service
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_URL: tcp://message-queue:61616
      SPRING_ARTEMIS_PASSWORD: ${artemis_mq_password}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "5005:5005" #Debug port
    depends_on:
      - discovery-server
      - notification-database
    networks:
      - for_company_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SPRING_PROFILES_ACTIVE: ${active_profile}
      CLIENT_APPLICATION_ADDRESS: ${client_application_address}
      TOKEN_SECRET_KEY: ${token_secret_key}
      SPRING_DATA_MONGODB_URI: mongodb://notification-database:27017/notification-service
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PASSWORD: ${spring_mail_password}
      SPRING_MAIL_USERNAME: for.company.document.generator@gmail.com
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: 10000
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITE_TIMEOUT: 10000
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTION_TIMEOUT: 10000
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:password@discovery-server:8761/eureka

  authentication-database:
    image: postgres:15-bookworm
    container_name: authentication-database
    volumes:
      - authentication_service_data:/var/lib/postgresql/data
    networks:
      - for_company_network
    environment:
      POSTGRES_DB: authentication-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgres_datasource_password}

  company-database:
    image: postgres:15-bookworm
    container_name: company-database
    volumes:
      - company_service_data:/var/lib/postgresql/data
    networks:
      - for_company_network
    environment:
      POSTGRES_DB: company-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgres_datasource_password}

  event-database:
    image: postgres:15-bookworm
    container_name: event-database
    volumes:
      - event_service_data:/var/lib/postgresql/data
    networks:
      - for_company_network
    environment:
      POSTGRES_DB: event-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgres_datasource_password}

  document-database:
    image: mongo:6-jammy
    container_name: document-database
    volumes:
      - document_service_data:/data/db
    networks:
      - for_company_network
    environment:
      MONGO_DB: document-service

  notification-database:
    image: mongo:6-jammy
    container_name: notification-database
    volumes:
      - notification_service_data:/data/db
    networks:
      - for_company_network
    environment:
      MONGO_DB: notification-service

  message-queue:
    image: apache/activemq-artemis:2.44.0-alpine
    container_name: message-queue
    ports:
      - "8161:8161"
      - "61616:61616" #Java message service
    networks:
      - for_company_network
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: ${artemis_mq_password}
      ANONYMOUS_LOGIN: false

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-viewer
    restart: always
    ports:
      - "9999:8080" #Dozzle panel port
    networks:
      - for_company_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  for_company_network:
    external: true

volumes:
  authentication_service_data:
  company_service_data:
  event_service_data:
  document_service_data:
  notification_service_data: