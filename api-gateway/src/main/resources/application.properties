# App
spring.application.name=api-gateway

# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Server
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Discovery Server Route
spring.cloud.gateway.server.webflux.routes[0].id=discovery-server
spring.cloud.gateway.server.webflux.routes[0].uri=http://discovery-server:8761
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/

# Authentication Service Route
spring.cloud.gateway.server.webflux.routes[1].id=authentication-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://authentication-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1.0/authentication/**

# Company Service Route
spring.cloud.gateway.server.webflux.routes[2].id=company-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://company-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1.0/company/**

# Event Service Route
spring.cloud.gateway.server.webflux.routes[3].id=event-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1.0/event/**

# Document Service Route
spring.cloud.gateway.server.webflux.routes[4].id=document-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://document-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1.0/document/**

# Notification Service Route
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1.0/notification/**

# Jwt
token.secret.key=${TOKEN_SECRET_KEY}

# Cors
cors.client.max.age=3600
cors.client.configurations.path=/**
cors.client.allowed.credentials=true
cors.client.allowed.origin=${CLIENT_APPLICATION_ADDRESS}
cors.client.allowed.headers=Authorization,Content-Type,Accept
cors.client.allowed.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder=ERROR